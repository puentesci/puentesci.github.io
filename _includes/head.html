<!-- Shared <head> content -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ page.description | default: 'Refurbished HPLC systems, columns, deuterium lamps, and hard-to-find lab parts — tested U.S. equipment shipped to laboratories worldwide.' }}">
<meta name="keywords" content="{{ page.keywords | default: 'refurbished HPLC, used lab equipment, HPLC columns, deuterium lamps, lab equipment export, Puente Scientific' }}">
<meta name="author" content="Puente Scientific">
<meta name="theme-color" content="#FFFFFF">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: 'Refurbished HPLC systems, columns, deuterium lamps, and hard-to-find lab parts — tested U.S. equipment shipped to laboratories worldwide.' }}">
<meta property="og:image" content="{{ site.url }}{{ page.og_image | default: '/assets/images/logo.png' }}">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="{{ site.url }}{{ page.url }}">
<meta property="twitter:title" content="{{ page.title | default: site.title }}">
<meta property="twitter:description" content="{{ page.description | default: 'Refurbished HPLC systems, columns, deuterium lamps, and hard-to-find lab parts — tested U.S. equipment shipped to laboratories worldwide.' }}">
<meta property="twitter:image" content="{{ site.url }}{{ page.og_image | default: '/assets/images/logo.png' }}">

<title>{{ page.title | default: site.title }}</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/logo.png">

<!-- No preload needed for text-based loading screen -->

<!-- Early session flag to skip loader without flash -->
<script>
  try {
    if (sessionStorage.getItem('ps_loader_shown') === '1') {
      document.documentElement.classList.add('ps-skip-loader');
    }
  } catch (e) {}
  // Expose reduced motion preference early
  window.prefersReducedMotion = window.prefersReducedMotion || function(){
    try { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; }
  };
  
</script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Stylesheets -->
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/reset.css?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/variables.css?v={{ site.time | date: '%s' }}">

<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/modern.css?v={{ site.time | date: '%s' }}">

{% if page.extra_css %}
  {% for css in page.extra_css %}
    <link rel="stylesheet" href="{{ site.baseurl }}/{{ css }}?v={{ site.time | date: '%s' }}">
  {% endfor %}
{% endif %}
